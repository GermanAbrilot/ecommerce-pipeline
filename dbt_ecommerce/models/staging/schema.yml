version: 2

sources:
  - name: raw_data
    schema: raw
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_items

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null